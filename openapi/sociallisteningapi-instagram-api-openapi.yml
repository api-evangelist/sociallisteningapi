components:
  schemas:
    DiscoveryResult:
      type: object
      required:
      - id
      - platform
      - type
      - name
      - username
      - url
      - image_url
      - verified
      - count
      - ext
      properties:
        id:
          type: string
        platform:
          type: string
          const: instagram
        type:
          type: string
          enum:
          - user
          - hashtag
          - place
        name:
          type:
          - string
          - 'null'
        username:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
        image_url:
          type:
          - string
          - 'null'
          format: uri
        verified:
          type:
          - boolean
          - 'null'
        count:
          type:
          - integer
          - 'null'
          minimum: 0
        ext:
          type: object
          description: Platform-specific normalized discovery fields.
          additionalProperties: true
      additionalProperties: false
    DiscoverySearchData:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryResult'
      additionalProperties: false
    Error:
      type: object
      required:
      - type
      - message
      - status
      properties:
        type:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: A required request parameter is missing or invalid
        status:
          type: integer
          minimum: 400
          maximum: 599
      additionalProperties: false
    Pagination:
      type: object
      required:
      - next_cursor
      - has_more
      - page_size
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: A provider cursor for a future paginated request, when available.
        has_more:
          type: boolean
        page_size:
          type: integer
          minimum: 0
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
      - success
      - error
      - request_id
      - credits_used
      - credits_remaining
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/Error'
        request_id:
          type: string
        credits_used:
          type: integer
          const: 0
        credits_remaining:
          type:
          - integer
          - 'null'
          minimum: 0
      additionalProperties: false
      example:
        success: false
        error:
          type: INVALID_REQUEST
          message: A required request parameter is missing or invalid
          status: 400
        request_id: req_example123
        credits_used: 0
        credits_remaining: 100
    Profile:
      type: object
      required:
      - id
      - platform
      - username
      - display_name
      - avatar_url
      - bio
      - verified
      - followers
      - following
      - posts_count
      - likes_count
      - url
      - location
      - external_url
      - private
      - joined_at
      - ext
      properties:
        id:
          type: string
        platform:
          type: string
          enum:
          - linkedin
          - x
          - instagram
        username:
          type:
          - string
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
          format: uri
        bio:
          type:
          - string
          - 'null'
        verified:
          type:
          - boolean
          - 'null'
        followers:
          type:
          - integer
          - 'null'
        following:
          type:
          - integer
          - 'null'
        posts_count:
          type:
          - integer
          - 'null'
        likes_count:
          type:
          - integer
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
        location:
          type:
          - string
          - 'null'
        external_url:
          type:
          - string
          - 'null'
          format: uri
        private:
          type:
          - boolean
          - 'null'
        joined_at:
          type:
          - string
          - 'null'
          format: date-time
        ext:
          type: object
          description: Platform-specific normalized profile fields.
          additionalProperties: true
      additionalProperties: false
    RawResponse:
      description: The unchanged upstream provider response. Returned only when the request sets raw to true.
    ProfileResponse:
      type: object
      required:
      - success
      - platform
      - endpoint
      - data
      - pagination
      - request_id
      - credits_used
      - credits_remaining
