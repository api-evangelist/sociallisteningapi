paths:
  /api/v1/instagram/search:
    get:
      operationId: searchInstagram
      tags:
      - Instagram
      summary: Search Instagram
      description: Search public Instagram users, hashtags, and places by keyword. Returns normalized discovery results, without post content.
      x-credit-cost: 1
      responses:
        '200':
          description: Request completed successfully.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverySearchResponse'
              example:
                success: true
                platform: instagram
                endpoint: /api/v1/instagram/search
                data:
                  items:
                  - id: '25025320'
                    platform: instagram
                    type: user
                    name: Instagram
                    username: instagram
                    url: https://www.instagram.com/instagram/
                    image_url: https://example.com/instagram.jpg
                    verified: true
                    count: null
                    ext:
                      position: 0
                pagination:
                  next_cursor: null
                  has_more: false
                  page_size: 1
                raw:
                  success: true
                  credits_remaining: 99
                  credits_charged: 1
                  data:
                    query: instagram
                    users: []
                    hashtags: []
                    places: []
                    keywords: []
                    rank_token: example-rank-token
                request_id: req_example123
                credits_used: 1
                credits_remaining: 99
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '402':
          $ref: '#/components/responses/InsufficientCredits'
        '403':
          $ref: '#/components/responses/WorkspaceNotActivated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamProviderError'
      parameters:
      - name: query
        in: query
        required: true
        description: The keyword or phrase to search for.
        schema:
          type: string
          minLength: 1
        example: social listening
      - name: raw
        in: query
        required: false
        description: Include the unchanged provider response in the raw field. Defaults to false.
        schema:
          type: boolean
          default: false
        example: true
    post:
      operationId: searchInstagramWithPost
      tags:
      - Instagram
      summary: Search Instagram
      description: Search public Instagram users, hashtags, and places by keyword. Returns normalized discovery results, without post content.
      x-credit-cost: 1
