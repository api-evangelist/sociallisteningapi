                    image_url: https://example.com/instagram.jpg
                    verified: true
                    count: null
                    ext:
                      position: 0
                pagination:
                  next_cursor: null
                  has_more: false
                  page_size: 1
                raw:
                  success: true
                  credits_remaining: 99
