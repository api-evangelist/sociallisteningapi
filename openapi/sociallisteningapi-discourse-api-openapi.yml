  headers:
    RateLimitRemaining:
      description: The requests remaining in the current minute.
      schema:
        type: integer
    RateLimitLimit:
      description: The maximum requests allowed in the current minute.
      schema:
        type: integer
    RetryAfter:
      description: The seconds until another request can be attempted.
      schema:
        type: integer
    RateLimitReset:
      description: The Unix timestamp when the current rate-limit window resets.
      schema:
        type: integer
    RequestId:
      description: The unique ID assigned to the request.
      schema:
        type: string
  schemas:
    Content:
      type: object
      required:
      - title
      - text
      - media_urls
      - thumbnail_url
      properties:
        title:
          type:
          - string
          - 'null'
        text:
          type:
          - string
          - 'null'
        media_urls:
          type: array
          items:
            type: string
            format: uri
        thumbnail_url:
          type:
          - string
          - 'null'
          format: uri
      additionalProperties: false
    Error:
      type: object
      required:
      - type
      - message
      - status
      properties:
        type:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: A required request parameter is missing or invalid
        status:
          type: integer
          minimum: 400
          maximum: 599
      additionalProperties: false
    SocialPost:
      type: object
      required:
      - id
      - platform
      - url
      - content
      - author
      - engagement
      - published_at
      - ext
      properties:
        id:
          type: string
        platform:
          type: string
          enum:
          - linkedin
          - x
          - reddit
          - facebook
          - hackernews
          - tiktok
          - youtube
          - pinterest
          - discourse
        url:
          type:
          - string
          - 'null'
          format: uri
        content:
          $ref: '#/components/schemas/Content'
        author:
          $ref: '#/components/schemas/Author'
        engagement:
          $ref: '#/components/schemas/Engagement'
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        ext:
          type: object
          description: Platform-specific normalized fields.
          additionalProperties: true
      additionalProperties: false
    DiscourseSearchResponse:
      type: object
      required:
      - success
      - platform
      - endpoint
      - data
      - pagination
      - request_id
      - credits_used
      - credits_remaining
      properties:
        success:
          type: boolean
          const: true
        platform:
          type: string
          const: discourse
        endpoint:
          type: string
        data:
          $ref: '#/components/schemas/SocialSearchData'
        pagination:
          $ref: '#/components/schemas/Pagination'
        raw:
          $ref: '#/components/schemas/RawResponse'
        request_id:
          type: string
          example: req_4QfL8rGv2NwK7zXp
        credits_used:
          type: integer
          minimum: 0
        credits_remaining:
          type:
          - integer
          - 'null'
          minimum: 0
      additionalProperties: false
    Pagination:
      type: object
      required:
      - next_cursor
      - has_more
      - page_size
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: A provider cursor for a future paginated request, when available.
        has_more:
          type: boolean
        page_size:
          type: integer
          minimum: 0
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
      - success
      - error
      - request_id
      - credits_used
      - credits_remaining
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/Error'
        request_id:
          type: string
        credits_used:
          type: integer
          const: 0
        credits_remaining:
          type:
          - integer
          - 'null'
          minimum: 0
      additionalProperties: false
      example:
        success: false
        error:
          type: INVALID_REQUEST
          message: A required request parameter is missing or invalid
          status: 400
        request_id: req_example123
        credits_used: 0
        credits_remaining: 100
    Author:
      type: object
      required:
      - id
      - username
      - display_name
      - avatar_url
      - verified
      properties:
        id:
          type:
          - string
          - 'null'
        username:
          type:
          - string
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
          format: uri
        verified:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    SocialSearchData:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SocialPost'
      additionalProperties: false
    RawResponse:
      description: The unchanged upstream provider response. Returned only when the request sets raw to true.
    Engagement:
      type: object
      required:
      - views
      - likes
      - comments
      - shares
      - saves
      properties:
        views:
          type:
          - integer
          - 'null'
        likes:
          type:
          - integer
          - 'null'
        comments:
          type:
          - integer
          - 'null'
        shares:
          type:
          - integer
          - 'null'
        saves:
          type:
          - integer
          - 'null'
      additionalProperties: false
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Your SocialListeningAPI key.
