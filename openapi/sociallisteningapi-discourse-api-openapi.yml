      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - query
              properties:
                url:
                  type: string
                  minLength: 1
                  format: uri
                  description: The full URL of the Discourse forum to search.
                query:
                  type: string
                  minLength: 1
