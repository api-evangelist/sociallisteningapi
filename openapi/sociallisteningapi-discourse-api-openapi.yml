paths:
  /api/v1/discourse/search:
    get:
      operationId: searchDiscourse
      tags:
      - discourse
      summary: Search a Discourse forum
      description: Search posts in one public Discourse forum by URL and keyword, newest first, and return normalized post and source data.
      x-credit-cost: 1
