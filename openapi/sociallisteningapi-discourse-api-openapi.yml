      parameters:
      - name: url
        in: query
        required: true
        description: The full URL of the Discourse forum to search.
        schema:
          type: string
          minLength: 1
          format: uri
        example: https://discourse.32bit.cafe
      - name: query
        in: query
        required: true
        description: The keyword or phrase to search for.
        schema:
          type: string
          minLength: 1
        example: social listening
      - name: exact
        in: query
        required: false
        description: Search for the exact phrase by wrapping the query in double quotes. Defaults to true. Set to false to send the query unchanged.
        schema:
          type: boolean
          default: true
        example: true
      - name: cursor
        in: query
        required: false
        description: The cursor returned by the previous response.
        schema:
          type: string
          minLength: 1
          pattern: ^[1-9][0-9]*$
        example: '2'
      - name: raw
        in: query
        required: false
        description: Include the unchanged provider response in the raw field. Defaults to false.
        schema:
          type: boolean
          default: false
        example: true
    post:
      operationId: searchDiscourseWithPost
      tags:
