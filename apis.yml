name: SocialListeningAPI

aid: sociallisteningapi

description: SocialListeningAPI is a social listening API for developers and AI agents that searches public posts, videos, profiles, forum discussions
  and Google results across LinkedIn, X, Reddit, Facebook, Hacker News, TikTok, YouTube, Pinterest, Instagram, Google and Discourse through one
  x-api-key and a normalized response shape. It is priced with one-time credit packs that do not expire, publishes an OpenAPI 3.1 document at
  api.sociallisteningapi.com/openapi.json, and runs an OAuth-protected remote MCP server for Claude and ChatGPT. It began as the API behind the
  Mentionkit social listening app and is operated by Nazare Studios Pty Ltd (Victoria, Australia).

