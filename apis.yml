- aid: sociallisteningapi:sociallisteningapi
  name: SocialListeningAPI
  description: REST API that searches and retrieves public social data (LinkedIn, X, Reddit, Facebook, Hacker News, TikTok, YouTube, Pinterest,
    Instagram, Google and Discourse) with a normalized response, cursor pagination and per-endpoint credit costs. Every path accepts GET with
    query parameters or POST with a JSON body; requests authenticate with an x-api-key header (keys start with slapi_).
