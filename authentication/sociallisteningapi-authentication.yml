- name: ApiKeyAuth
  type: apiKey
  in: header
  parameter: x-api-key
  description: Your SocialListeningAPI key.
  key_prefix: slapi_
  applies_to: REST API (https://api.sociallisteningapi.com/api/v1/*)
  obtain: Create an account, activate it from the email, then copy the key from the dashboard or Settings > API
    key.
  errors:
    '401': A missing or invalid key returns 401.
    '403': An account that has not been activated returns 403.
    '402': If the workspace has no credits left, the API returns 402.
  guidance: Do not put it in the URL. Keep it out of browser code, mobile apps, public repositories, screenshots,
    and logs. Call SocialListeningAPI from your server so the key stays private.
